# Configuracion para Pruebas (Base de datos en Memoria - H2)
spring.application.name=OficioYa-Backend-Test

# H2 Configuration
spring.datasource.url=jdbc:h2:mem:oficioyatestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Embebido para Pruebas (Flapdoodle) o mock
# Nota: Si las pruebas fallan por no tener Mongo embebido, asegúrate de tener de.flapdoodle.embed.mongo en el pom.xml
# o ignorar la conexion a mongo para ciertas pruebas
spring.data.mongodb.port=0
spring.data.mongodb.host=localhost
spring.data.mongodb.database=test_db
